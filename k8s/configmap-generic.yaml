apiVersion: v1
kind: ConfigMap
metadata:
  name: py-smtp-relay
data:
  app.py: |
    import os, smtplib, ipaddress, sys
    import smtpd, asyncore
    from email import policy
    from email.parser import Parser
    from email.message import EmailMessage
    from email.utils import formatdate, make_msgid

    GMAIL_USER = os.environ["GMAIL_USER"]
    GMAIL_APP_PASSWORD = os.environ["GMAIL_APP_PASSWORD"]
    FROM_NAME = os.environ.get("FROM_NAME", "SAU Portal")
    LISTEN_HOST = os.environ.get("LISTEN_HOST", "0.0.0.0")
    LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "25"))
    OVERRIDE_HEADER_FROM = os.environ.get("OVERRIDE_HEADER_FROM", "true").lower() == "true"
    MAX_SIZE = int(os.environ.get("MAX_SIZE", "20971520"))  # 20 MB
    ALLOW_NETS = [ipaddress.ip_network(n.strip(), strict=False)
                  for n in os.environ.get("ALLOW_NETS", "10.42.0.0/16,10.43.0.0/16,127.0.0.0/8,::1/128").split(",") if n.strip()]

    def allowed_peer(ip_str: str) -> bool:
      try:
        ip = ipaddress.ip_address(ip_str)
      except ValueError:
        return False
      return any(ip in net for net in ALLOW_NETS)

    class RelayServer(smtpd.SMTPServer):
      def process_message(self, peer, mailfrom, rcpttos, data, **kwargs):
        peer_ip = peer[0] if isinstance(peer, tuple) and len(peer) >= 1 else "0.0.0.0"
        if not allowed_peer(peer_ip):
          print(f"DENY {peer_ip}: not in allowed nets", file=sys.stderr)
          return "554 5.7.1 Relay access denied"

        if len(data) > MAX_SIZE:
          return "552 5.3.4 Message size exceeds fixed maximum size"

        # Parse incoming message (string)
        msg_in = Parser(policy=policy.SMTP).parsestr(data)

        # Ensure Date and Message-ID
        if "Date" not in msg_in:
          msg_in["Date"] = formatdate(localtime=True)
        if "Message-Id" not in msg_in and "Message-ID" not in msg_in:
          msg_in["Message-Id"] = make_msgid(domain="gmail.com")

        # Optionally normalize header From to the Gmail account
        if OVERRIDE_HEADER_FROM:
          from_value = f"{FROM_NAME} <{GMAIL_USER}>"
          if "From" in msg_in:
            msg_in.replace_header("From", from_value)
          else:
            msg_in["From"] = from_value

        # Envelope sender -> Gmail for DMARC alignment
        envelope_from = GMAIL_USER

        try:
          with smtplib.SMTP("smtp.gmail.com", 587, timeout=30) as s:
            s.starttls()
            s.login(GMAIL_USER, GMAIL_APP_PASSWORD)
            s.sendmail(envelope_from, rcpttos, msg_in.as_bytes())
          print(f"OK relay from={mailfrom} to={rcpttos} msgid={msg_in.get('Message-Id')}")
          return "250 2.0.0 OK"
        except smtplib.SMTPException as e:
          print(f"ERROR upstream SMTP: {e}", file=sys.stderr)
          return "451 4.3.0 Upstream SMTP error"
        except Exception as e:
          print(f"ERROR internal: {e}", file=sys.stderr)
          return "451 4.3.0 Internal error"

    if __name__ == "__main__":
      server = RelayServer((LISTEN_HOST, LISTEN_PORT), None)
      print(f"Python SMTP relay listening on {LISTEN_HOST}:{LISTEN_PORT}")
      try:
        asyncore.loop()
      except KeyboardInterrupt:
        pass