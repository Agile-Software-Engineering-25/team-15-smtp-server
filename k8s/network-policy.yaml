apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-smtp-from-apps
spec:
  podSelector:
    matchLabels:
      app: smtp-relay
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              access-smtp-relay: "true"
      ports:
        - protocol: TCP
          port: 25
  policyTypes: ["Ingress"]