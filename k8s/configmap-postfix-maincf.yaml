apiVersion: v1
kind: ConfigMap
metadata:
  name: postfix-maincf
data:
  main.cf: |
    # Null-client relay via Gmail
    myhostname = smtp-relay.mail-relay.svc.cluster.local
    myorigin = $myhostname
    inet_interfaces = all
    # Allow only in-cluster clients
    mynetworks = 10.42.0.0/16, 10.43.0.0/16, 127.0.0.0/8
    relayhost = [smtp.gmail.com]:587

    # TLS & SASL to Gmail
    smtp_use_tls = yes
    smtp_tls_security_level = encrypt
    smtp_tls_CAfile = /etc/ssl/certs/ca-certificates.crt

    smtp_sasl_auth_enable = yes
    smtp_sasl_password_maps = hash:/etc/postfix/sasl_passwd
    smtp_sasl_security_options = noanonymous
    smtp_sasl_tls_security_options = noanonymous

    # Do not act as final destination for any domains
    mydestination =
    local_transport = error:local delivery disabled
    relay_domains = *

    # Optional: rewrite envelope sender to your Gmail (helps Gmail accept it)
    # Replace with your Gmail address to avoid "not permitted" senders.
    smtp_generic_maps = regexp:/etc/postfix/generic