apiVersion: apps/v1
kind: Deployment
metadata:
  name: py-smtp-relay
  namespace: ase-15
spec:
  replicas: 1
  selector:
    matchLabels: { app: py-smtp-relay }
  template:
    metadata:
      labels: { app: py-smtp-relay }
    spec:
      containers:
        - name: app
          image: python:3.10-slim
          ports:
            - containerPort: 25
          env:
            - name: GMAIL_USER
              valueFrom: { secretKeyRef: { name: gmail-sasl, key: RELAYHOST_USERNAME } }
            - name: GMAIL_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: gmail-sasl, key: RELAYHOST_PASSWORD } }
            - name: FROM_NAME
              value: "SAU Portal"
            - name: ALLOW_NETS
              value: "10.42.0.0/16,10.43.0.0/16,127.0.0.0/8,::1/128"
            - name: LISTEN_HOST
              value: "0.0.0.0"
            - name: LISTEN_PORT
              value: "25"
            - name: OVERRIDE_HEADER_FROM
              value: "true"   # set "false" to keep original From:
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 0        # needs root to bind :25 (or switch to port 2525)
          volumeMounts:
            - name: code
              mountPath: /app
          workingDir: /app
          command: ["/bin/sh","-c"]
          args:
            - |
              pip install --no-cache-dir -r requirements.txt && \
              python /app/app.py
          readinessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 25 }
            initialDelaySeconds: 10
            periodSeconds: 20
      volumes:
        - name: code
          configMap:
            name: py-smtp-relay