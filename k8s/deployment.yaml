apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smtp-relay
  template:
    metadata:
      labels:
        app: smtp-relay
    spec:
      securityContext:
        fsGroup: 0
      volumes:
        - name: etc-postfix
          emptyDir: {}
        - name: cm-main
          configMap:
            name: postfix-maincf
        - name: cm-generic
          configMap:
            name: postfix-generic
        - name: secret-sasl
          secret:
            secretName: postfix-sasl
      initContainers:
        - name: setup-postfix
          image: debian:stable-slim
          command:
            - /bin/sh
            - -c
            - |
              set -e
              apt-get update && apt-get install -y --no-install-recommends postfix ca-certificates && rm -rf /var/lib/apt/lists/*
              cp /cm/main.cf /etc/postfix/main.cf
              cp /cmg/generic /etc/postfix/generic
              cp /secret/sasl_passwd /etc/postfix/sasl_passwd
              postmap /etc/postfix/sasl_passwd
              postmap /etc/postfix/generic
              chmod 600 /etc/postfix/sasl_passwd /etc/postfix/sasl_passwd.db /etc/postfix/generic /etc/postfix/generic.db
              cp -a /etc/postfix/* /out/
          volumeMounts:
            - name: etc-postfix
              mountPath: /out
            - name: cm-main
              mountPath: /cm
            - name: cm-generic
              mountPath: /cmg
            - name: secret-sasl
              mountPath: /secret
      containers:
        - name: postfix
          image: instrumentisto/postfix:3.9
          args: ["start-fg"]
          ports:
            - name: smtp
              containerPort: 25
          volumeMounts:
            - name: etc-postfix
              mountPath: /etc/postfix
          readinessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 25
            initialDelaySeconds: 10
            periodSeconds: 10