apiVersion: apps/v1
kind: Deployment
metadata:
  name: smtp-relay
  namespace: ase-15
spec:
  replicas: 1
  selector:
    matchLabels: { app: smtp-relay }
  template:
    metadata:
      labels: { app: smtp-relay }
    spec:
      containers:
        - name: postfix
          image: boky/postfix:latest
          ports:
            - name: smtp
              containerPort: 25
          env:
            # --- Identity / HELO
            - name: HOSTNAME
              value: smtp-relay.ase-15.svc.cluster.local
            - name: POSTFIX_myhostname
              value: relay.sau-portal.de
            - name: POSTFIX_smtp_helo_name
              value: relay.sau-portal.de

            # --- Networking
            - name: POSTFIX_inet_protocols
              value: "ipv4"                               # <-- avoids ::1 issues
            - name: POSTFIX_mynetworks
              value: "10.42.0.0/16, 10.43.0.0/16, 127.0.0.0/8"

            # --- Relay to Gmail with AUTH
            - name: RELAYHOST
              value: "[smtp.gmail.com]:587"
            - name: RELAYHOST_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gmail-sasl
                  key: RELAYHOST_USERNAME
            - name: RELAYHOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gmail-sasl
                  key: RELAYHOST_PASSWORD

            # --- Logs to stdout
            - name: POSTFIX_maillog_file
              value: "/dev/stdout"

            # --- Alias local root (DSNs, cron)
            - name: ALIASES
              value: "root: sau.portal.noreply@gmail.com"

            # --- SMTP auth/TLS
            - name: POSTFIX_smtp_use_tls
              value: "yes"
            - name: POSTFIX_smtp_tls_security_level
              value: "encrypt"
            - name: POSTFIX_smtp_sasl_auth_enable
              value: "yes"
            - name: POSTFIX_smtp_sasl_security_options
              value: "noanonymous"
            - name: POSTFIX_smtp_sasl_tls_security_options
              value: "noanonymous"

            # --- Null-client (no local delivery)
            - name: POSTFIX_myorigin
              value: "$myhostname"
            - name: POSTFIX_mydestination
              value: ""
            - name: POSTFIX_local_transport
              value: "error:local delivery disabled"
            - name: POSTFIX_relay_domains
              value: "*"

            # --- Ingress policy in Postfix
            - name: POSTFIX_smtpd_relay_restrictions
              value: "permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination"
            - name: POSTFIX_smtpd_recipient_restrictions
              value: "reject_non_fqdn_recipient, reject_unknown_recipient_domain, check_recipient_access regexp:/etc/postfix/recipient_access, permit_mynetworks, permit_sasl_authenticated, reject_unauth_destination"

            # --- Rewrites
            - name: POSTFIX_smtp_generic_maps
              value: "regexp:/etc/postfix/generic"        # envelope sender -> Gmail
            - name: POSTFIX_sender_canonical_maps
              value: "regexp:/etc/postfix/sender_canonical" # ALL local senders -> Gmail

            # --- (keep if you need it)
            - name: ALLOW_EMPTY_SENDER_DOMAINS
              value: "true"

          volumeMounts:
            - name: generic
              mountPath: /etc/postfix/generic
              subPath: generic
            - name: sender-canonical
              mountPath: /etc/postfix/sender_canonical
              subPath: sender_canonical
            - name: recipient-access
              mountPath: /etc/postfix/recipient_access
              subPath: recipient_access
            - name: postfix-init
              mountPath: /docker-init.db
              readOnly: true
      volumes:
        - name: generic
          configMap:
            name: postfix-generic
        - name: sender-canonical
          configMap:
            name: postfix-sender-canonical
        - name: recipient-access
          configMap:
            name: postfix-recipient-access
        - name: postfix-init
          configMap:
            name: postfix-init
            defaultMode: 0755
